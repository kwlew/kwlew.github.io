# Refreshes assets/data/leetcode-stats.json (solved counts, recent accepted
# problems, contest rating) every 6 hours. Commits only when the numbers change.
name: LeetCode stats

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: leetcode-stats

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build stats
        run: node scripts/leetcode-stats.mjs

      - name: Commit if changed
        run: |
          git add assets/data/leetcode-stats.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update LeetCode stats"
          git pull --rebase
          git push
