<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Full competition record for kwlew (Kaleo Soares): RoboCup Rescue Maze, CBR, and Brazilian science, maths and informatics olympiads from 2021 onward." />
  <meta property="og:type"             content="website" />
  <meta property="og:url"              content="https://kwlew.dev/achievements.html" />
  <meta property="og:title"            content="Achievements &bull; kwlew.dev" />
  <meta property="og:description"      content="Full competition record: RoboCup Rescue Maze, CBR, and Brazilian science, maths and informatics olympiads from 2021 onward." />
  <meta property="og:image"            content="https://kwlew.dev/assets/images/og-image.png?v=2" />
  <meta name="twitter:card"            content="summary_large_image" />
  <meta name="twitter:title"           content="Achievements • kwlew.dev" />
  <meta name="twitter:description"     content="Full competition record: RoboCup Rescue Maze, CBR, and Brazilian science, maths and informatics olympiads from 2021 onward." />
  <meta name="twitter:image"           content="https://kwlew.dev/assets/images/og-image.png?v=2" />
  <title>Achievements &bull; kwlew.dev</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/images/favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css?v=22">
</head>
<body>
  <canvas id="particles-bg" aria-hidden="true"></canvas>
  <a href="/" class="home-btn vt-brand" title="Home"><span aria-hidden="true">&larr;</span> kwlew.dev</a>

  <header>
    <h1 class="vt-achievements">Achievements</h1>
    <p class="subtitle">Domestic and international competition results</p>
    <p class="tagline">Every result since 2021, across robotics, informatics, maths and science.</p>
  </header>

  <main class="container" style="padding-bottom: 20px;">

    <div class="ach-tabs" role="tablist" aria-label="Achievement view">
      <button class="ach-tab active" role="tab" aria-selected="true"  data-ach-tab="personal">Personal</button>
      <button class="ach-tab"        role="tab" aria-selected="false" data-ach-tab="team">ByteVoltaTeam</button>
    </div>

    <!-- Both panels are rendered from the ACHIEVEMENTS data below;
         RoboCup/CBR appear in both without being written out twice. -->
    <div class="ach-panel" id="ach-personal" role="tabpanel"></div>
    <div class="ach-panel" id="ach-team" role="tabpanel" hidden></div>

  </main>

  <footer>
    <p>&copy; 2026 kwlew.dev</p>
  </footer>

  <script src="/assets/js/particles.js?v=4"></script>
  <script src="/assets/js/achievements-data.js?v=1"></script>
  <script>
    const { ACHIEVEMENTS, PANELS } = window.KW_RECORD;

    // ===== ACHIEVEMENT RENDERING =====
    const esc = (s) => String(s).replace(/[&<>"]/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    ));

    function renderResult(r) {
      if (r.group) {
        return `<div class="medal-group-label">${esc(r.group)} · ` +
               `<span class="medal-group-place">${esc(r.place)}</span></div>`;
      }

      let lead = '';
      if (r.year)       lead = `<span class="medal-year">${esc(r.year)}</span>`;
      else if (r.label) lead = `<span class="medal-entry-label">${esc(r.label)}</span>`;

      return `<div class="medal-entry">${lead}` +
             `<span class="medal-badge ${esc(r.badge)}">${esc(r.text)}</span></div>`;
    }

    function renderCard(id) {
      const a = ACHIEVEMENTS[id];
      return `<div class="card achievement-card${a.wide ? ' achievement-wide' : ''}">` +
               `<div class="achievement-acronym">${esc(a.acronym)}</div>` +
               `<div class="achievement-fullname">${esc(a.fullname)}</div>` +
               `<div class="achievement-subtitle">${esc(a.subtitle)}</div>` +
               (a.note ? `<p class="achievement-note">${esc(a.note)}</p>` : '') +
               `<div class="medal-list">${a.results.map(renderResult).join('')}</div>` +
             `</div>`;
    }

    function renderPanel(key) {
      const p = PANELS[key];

      const summaries = p.summaries.map(row =>
        `<div class="medal-summary">` +
          row.map(s =>
            `<div class="medal-summary-item ${esc(s.kind)}">` +
              `<span class="medal-summary-count">${esc(s.count)}</span>` +
              `<span class="medal-summary-label">${esc(s.label)}</span>` +
            `</div>`
          ).join('') +
        `</div>`
      ).join('');

      return summaries +
        `<div class="achievements-grid">${p.cards.map(renderCard).join('')}</div>`;
    }

    document.getElementById('ach-personal').innerHTML = renderPanel('personal');
    document.getElementById('ach-team').innerHTML = renderPanel('team');

    // ===== TAB SWITCHING =====
    const achTabs = document.querySelectorAll('.ach-tab');
    const achPanels = {
      personal: document.getElementById('ach-personal'),
      team: document.getElementById('ach-team')
    };

    achTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const key = tab.dataset.achTab;

        achTabs.forEach(t => {
          const on = t === tab;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', String(on));
        });

        Object.entries(achPanels).forEach(([k, panel]) => {
          const on = k === key;
          panel.hidden = !on;
          panel.classList.remove('panel-entering');
          if (on) {
            // Force a reflow so the re-entry animation restarts.
            void panel.offsetWidth;
            panel.classList.add('panel-entering');
          }
        });
      });
    });

    achPanels.personal.classList.add('panel-entering');
  </script>
</body>
</html>
