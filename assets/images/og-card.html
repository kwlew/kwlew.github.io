<!--
  Source for assets/images/og-image.png (1200 x 630), the link preview image.

  It reuses the site's stylesheet and the real maze simulation, rendered
  with reduced motion so the maze shows one completed run. Absolute asset
  paths need the site served from its root:

    python -m http.server 8080
    open http://localhost:8080/assets/images/og-card.html
    DevTools > Rendering > emulate prefers-reduced-motion: reduce
    DevTools device toolbar at 1200 x 630 > Capture screenshot

  Save the result over assets/images/og-image.png, then bump the ?v= on
  og-image.png in every page's og:image and twitter:image tags so link
  previews refresh.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>og-card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    /* Static stand-in for the site's dot-matrix background. */
    body {
      background:
        radial-gradient(circle, rgba(var(--c-text-rgb), 0.07) 0.9px, transparent 1.2px) 0 0 / 28px 28px,
        var(--c-bg);
    }

    .og {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 392px;
      gap: 56px;
      height: 100%;
      padding: 44px 56px 44px 64px;
    }

    .og-copy {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .og-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--c-text-muted);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .og-top .brand {
      font-size: 22px;
    }

    .og .kicker {
      font-size: 14px;
    }

    .og .hero-name {
      margin-top: 18px;
      font-size: 112px;
    }

    .og .hero-lead {
      max-width: none;
      margin-top: 26px;
      font-size: 30px;
      animation: none;
    }

    .og-figures {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--c-border);
    }

    .og-figures .figure {
      padding: 18px 16px 0 0;
    }

    .og-figures .figure + .figure {
      padding-left: 16px;
    }

    .og-figures .figure-num {
      font-size: 40px;
    }

    .og-figures .figure-label {
      margin-top: 10px;
      font-size: 11px;
    }

    .og .sim {
      align-self: center;
      animation: none;
    }

    .og .sim-bar {
      display: none;
    }
  </style>
</head>
<body>
  <main class="og">
    <div class="og-copy">
      <div class="og-top">
        <span class="brand">KWLEW<span>.DEV</span></span>
        <span>Fortaleza, BR</span>
      </div>

      <div>
        <p class="kicker">Backend / Robotics / Indie-dev</p>
        <h1 class="hero-name">
          <span class="line">Kaleo</span>
          <span class="line">Soares</span>
        </h1>
        <p class="hero-lead">I write the code that gets the robot<br><em>out of the maze.</em></p>
      </div>

      <div class="og-figures">
        <div class="figure">
          <span class="figure-num">6<small>th</small></span>
          <span class="figure-label">World, RoboCup</span>
        </div>
        <div class="figure">
          <span class="figure-num">2</span>
          <span class="figure-label">Intl. awards</span>
        </div>
        <div class="figure">
          <span class="figure-num">1<small>st</small></span>
          <span class="figure-label">CBR 2025</span>
        </div>
        <div class="figure">
          <span class="figure-num">11</span>
          <span class="figure-label">Olympiad medals</span>
        </div>
      </div>
    </div>

    <figure class="sim">
      <div class="sim-head">
        <span><b>SIM</b> / rescue_maze</span>
        <span>seed <b id="sim-seed">----</b> &middot; run <b id="sim-run">1</b></span>
      </div>
      <canvas class="sim-canvas" id="sim-canvas"></canvas>
      <div class="sim-bar"><div class="sim-speed" id="sim-speed"></div></div>
      <dl class="sim-readouts">
        <div><dt>Mapped</dt><dd id="sim-mapped">0/81</dd></div>
        <div><dt>Victims</dt><dd id="sim-victims">0/0</dd></div>
        <div><dt>Run time</dt><dd id="sim-time">00:00.0</dd></div>
        <div><dt>State</dt><dd id="sim-state">IDLE</dd></div>
      </dl>
    </figure>
  </main>

  <script src="/assets/js/maze-sim.js"></script>
</body>
</html>
